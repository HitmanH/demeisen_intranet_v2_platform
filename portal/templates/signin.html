{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block body %}<div class="card narrow"><i class="brand-mark loginlogo" aria-hidden="true"></i><h1>{{ cfg.FIRM_NAME }}</h1>
<form method="post" autocomplete="on"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>Email<input name="email" type="email" autocomplete="username" required autofocus></label>
<label>Password<input type="password" name="password" autocomplete="current-password" required></label>
<button>Continue</button></form>
<p class="muted">Next you'll be asked for the 6-digit code from your authenticator app.</p>
{% if prev %}<p class="muted">Not set up yet? <a href="{{ prev }}">Use the previous sign-in</a></p>{% endif %}
</div>{% endblock %}
