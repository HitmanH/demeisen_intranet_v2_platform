{% extends "base.html" %}{% block body %}<h1>Audit log</h1><table><tr><th>When</th><th>Who</th><th>Item</th><th>Action</th><th>Detail</th></tr>
{% for a in rows %}<tr><td>{{ a.at|fromiso }}</td><td>{{ a.name }}</td><td>{{ a.entity }} #{{ a.entity_id }}</td><td>{{ a.action }}</td><td>{{ a.detail }}</td></tr>{% endfor %}</table>{% endblock %}
