{% extends "base.html" %}{% block title %}Sign in{% endblock %}{% block body %}<div class="card narrow"><i class="brand-mark loginlogo" aria-hidden="true"></i><h1>Authenticator code</h1>
<form method="post"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
<label>6-digit code<input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus></label>
<button>Sign in</button></form><p class="muted"><a href="/signin">Start again</a></p></div>{% endblock %}
