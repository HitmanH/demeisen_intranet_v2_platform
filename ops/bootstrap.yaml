AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Demeisen v2 bootstrap, deployed once from AWS CloudShell (ops/setup.sh): the roles GitHub Actions uses to deploy
  (one per repo and purpose, no stored AWS keys), the CloudFormation role that does the work, the platform's image
  repository, two generated secrets, the AWS Backup role and a monthly cost alert. Holds no data.

Parameters:
  GitHubOwner: { Type: String, Default: HitmanH }
  # GitHub may put immutable IDs in the token subject (repo:Owner@OwnerId/Repo@RepoId:...), as it did for v1.
  GitHubOwnerId: { Type: String, Default: '5677860' }
  OidcProviderArn:
    Type: String
    Default: arn:aws:iam::642552605309:oidc-provider/token.actions.githubusercontent.com
    Description: 'The existing GitHub OIDC provider (created by v1; ops/setup.sh makes v1 keep it)'
  AlertEmail: { Type: String }
  MonthlyBudgetUsd: { Type: Number, Default: 120 }

Resources:
  # ---------- The role CloudFormation uses. GitHub roles may only pass it to their own stacks. ----------
  CfnExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: demeisen-v2-cfn-exec
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: cloudformation.amazonaws.com }, Action: 'sts:AssumeRole' }]
      ManagedPolicyArns: ['arn:aws:iam::aws:policy/PowerUserAccess']
      Policies:
        - PolicyName: roles-for-demeisen-v2-stacks-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [iam:CreateRole, iam:DeleteRole, iam:GetRole, iam:UpdateRole, iam:TagRole, iam:UntagRole, iam:PassRole,
                         iam:PutRolePolicy, iam:GetRolePolicy, iam:DeleteRolePolicy, iam:AttachRolePolicy, iam:DetachRolePolicy,
                         iam:ListRolePolicies, iam:ListAttachedRolePolicies, iam:UpdateAssumeRolePolicy]
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/demeisen-v2-*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt BackupRole.Arn
              - Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition: { StringLike: { 'iam:AWSServiceName': ['rds.amazonaws.com', 'backup.amazonaws.com', 'lambda.amazonaws.com', 'ops.apigateway.amazonaws.com'] } }

  # ---------- GitHub deploy roles ----------
  # App roles: main branch only; may change only their own app stack. Data roles: only jobs in the GitHub environment
  # "data" (which needs approval); may change only their own data stack.
  CrmAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: demeisen-v2-github-crm-app
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${OidcProviderArn}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},"StringLike":{"token.actions.githubusercontent.com:sub":["repo:${GitHubOwner}/${Repo}:ref:refs/heads/main","repo:${GitHubOwner}@${GitHubOwnerId}/${Repo}@*:ref:refs/heads/main"]}}}]}'
        - { Repo: demeisen_intranet_v2_crm }
      Policies:
        - PolicyName: deploy-crm-app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ['cloudformation:*'], Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/demeisen-v2-crm-app/*' }
              - { Effect: Allow, Action: ['cloudformation:GetTemplateSummary', 'cloudformation:ValidateTemplate'], Resource: '*' }
              - { Effect: Allow, Action: iam:PassRole, Resource: !GetAtt CfnExecRole.Arn }
              - { Effect: Allow, Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration, lambda:InvokeFunction], Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:demeisen-v2-crm-*' }
              - { Effect: Allow, Action: s3:PutObject, Resource: 'arn:aws:s3:::demeisen-v2-crm-app-sitebucket-*/*' }
              - { Effect: Allow, Action: [ssm:GetParameter, ssm:GetParameters], Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/demeisen/v2/*' }
  CrmDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: demeisen-v2-github-crm-data
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${OidcProviderArn}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},"StringLike":{"token.actions.githubusercontent.com:sub":["repo:${GitHubOwner}/${Repo}:environment:data","repo:${GitHubOwner}@${GitHubOwnerId}/${Repo}@*:environment:data"]}}}]}'
        - { Repo: demeisen_intranet_v2_crm }
      Policies:
        - PolicyName: deploy-crm-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ['cloudformation:*'], Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/demeisen-v2-crm-data/*' }
              - { Effect: Allow, Action: ['cloudformation:GetTemplateSummary', 'cloudformation:ValidateTemplate'], Resource: '*' }
              - { Effect: Allow, Action: iam:PassRole, Resource: !GetAtt CfnExecRole.Arn }
  PlatformAppRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: demeisen-v2-github-platform-app
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${OidcProviderArn}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},"StringLike":{"token.actions.githubusercontent.com:sub":["repo:${GitHubOwner}/${Repo}:ref:refs/heads/main","repo:${GitHubOwner}@${GitHubOwnerId}/${Repo}@*:ref:refs/heads/main"]}}}]}'
        - { Repo: demeisen_intranet_v2_platform }
      Policies:
        - PolicyName: deploy-platform-app
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ['cloudformation:*'], Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/demeisen-v2-platform-app/*' }
              - { Effect: Allow, Action: ['cloudformation:GetTemplateSummary', 'cloudformation:ValidateTemplate'], Resource: '*' }
              - { Effect: Allow, Action: iam:PassRole, Resource: !GetAtt CfnExecRole.Arn }
              - { Effect: Allow, Action: ecr:GetAuthorizationToken, Resource: '*' }
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload, ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage, ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:DescribeImages]
                Resource: !GetAtt ImageRepo.Arn
              - { Effect: Allow, Action: [lambda:InvokeFunction, lambda:GetFunction], Resource: !Sub 'arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:demeisen-v2-platform-admin' }
              - { Effect: Allow, Action: [ssm:GetParameter, ssm:GetParameters], Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/demeisen/v2/*' }
              - { Effect: Allow, Action: ssm:PutParameter, Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/demeisen/v2/edge/*' }
  PlatformDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: demeisen-v2-github-platform-data
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${OidcProviderArn}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},"StringLike":{"token.actions.githubusercontent.com:sub":["repo:${GitHubOwner}/${Repo}:environment:data","repo:${GitHubOwner}@${GitHubOwnerId}/${Repo}@*:environment:data"]}}}]}'
        - { Repo: demeisen_intranet_v2_platform }
      Policies:
        - PolicyName: deploy-platform-data
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ['cloudformation:*'], Resource: !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/demeisen-v2-platform-data/*' }
              - { Effect: Allow, Action: ['cloudformation:GetTemplateSummary', 'cloudformation:ValidateTemplate'], Resource: '*' }
              - { Effect: Allow, Action: iam:PassRole, Resource: !GetAtt CfnExecRole.Arn }
  AuthDataRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: demeisen-v2-github-auth-data
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: !Sub
        - '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":{"Federated":"${OidcProviderArn}"},"Action":"sts:AssumeRoleWithWebIdentity","Condition":{"StringEquals":{"token.actions.githubusercontent.com:aud":"sts.amazonaws.com"},"StringLike":{"token.actions.githubusercontent.com:sub":["repo:${GitHubOwner}/${Repo}:environment:data","repo:${GitHubOwner}@${GitHubOwnerId}/${Repo}@*:environment:data"]}}}]}'
        - { Repo: demeisen_intranet_v2_auth }
      Policies:
        - PolicyName: deploy-auth-pool
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['cloudformation:*']
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/demeisen-v2-auth-pool/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/demeisen-v2-auth-refs/*'
              - { Effect: Allow, Action: ['cloudformation:GetTemplateSummary', 'cloudformation:ValidateTemplate', 'cloudformation:DescribeStacks'], Resource: '*' }
              - { Effect: Allow, Action: iam:PassRole, Resource: !GetAtt CfnExecRole.Arn }
              - { Effect: Allow, Action: ssm:GetParameter, Resource: !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/demeisen/v2/edge/*' }

  # ---------- Platform image repository (code, rebuilt from git on every deploy) ----------
  ImageRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: demeisen-v2-platform
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep the last 30 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":30},"action":{"type":"expire"}}]}'

  # ---------- Generated secrets for the platform (session signing; proof a request came through the front door) ----------
  FlaskSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: demeisen-v2/platform/flask-secret
      GenerateSecretString: { PasswordLength: 64, ExcludePunctuation: true }
  OriginVerifySecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: demeisen-v2/platform/origin-verify
      GenerateSecretString: { PasswordLength: 48, ExcludePunctuation: true }

  # ---------- AWS Backup's role (used by both data stacks) ----------
  BackupRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: demeisen-v2-backup
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: backup.amazonaws.com }, Action: 'sts:AssumeRole' }]
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForBackup
        - arn:aws:iam::aws:policy/service-role/AWSBackupServiceRolePolicyForRestores

  # ---------- Cost alert for the whole account ----------
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: demeisen-v2-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit: { Amount: !Ref MonthlyBudgetUsd, Unit: USD }
      NotificationsWithSubscribers:
        - Notification: { NotificationType: ACTUAL, ComparisonOperator: GREATER_THAN, Threshold: 80, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]
        - Notification: { NotificationType: FORECASTED, ComparisonOperator: GREATER_THAN, Threshold: 100, ThresholdType: PERCENTAGE }
          Subscribers: [{ SubscriptionType: EMAIL, Address: !Ref AlertEmail }]

Outputs:
  CfnExecRoleArn: { Value: !GetAtt CfnExecRole.Arn }
  ImageRepoUri: { Value: !GetAtt ImageRepo.RepositoryUri }
