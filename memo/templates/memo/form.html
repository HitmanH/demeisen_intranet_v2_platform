{% extends "base.html" %}{% block body %}<h1>New expenditure memo</h1>
<form method="post" enctype="multipart/form-data" class="card"><div class="two">
<label class="full">Title<input name="title" required></label>
<label>Amount<input type="number" step="0.01" name="amount" required></label>
<label>Currency<select name="currency"><option>GBP</option><option>USD</option><option>EUR</option></select></label>
<label class="full">Supplier / payee<input name="supplier"></label>
<label class="full">Rationale, alternatives considered, budget impact<textarea name="body" rows="8" required></textarea></label>
<label class="full">Supporting document (quote, contract…)<input type="file" name="file"></label></div>
<p><small>Every active LLP member (including you) must approve. Spend of {{ cfg.MATERIAL_THRESHOLD }} or more is treated as material.</small></p>
<button>Submit for sign-off</button></form>{% endblock %}
